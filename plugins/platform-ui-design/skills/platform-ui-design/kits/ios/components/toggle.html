<!-- slot: toggle · group: Selection & input · title: Toggles · subtitle: On · off · disabled · ref: apple-components.md §Toggles -->
<section class="pud-card">
  <div class="ios-toggle-rows">
    <div class="ios-toggle-row">
      <p class="ios-body">Wi-Fi</p>
      <span class="ios-toggle ios-toggle--on" role="switch" aria-checked="true">
        <span class="ios-toggle__knob"></span>
      </span>
    </div>
    <div class="ios-toggle-row">
      <p class="ios-body">Bluetooth</p>
      <span class="ios-toggle" role="switch" aria-checked="false">
        <span class="ios-toggle__knob"></span>
      </span>
    </div>
    <div class="ios-toggle-row">
      <p class="ios-body">Low Data Mode</p>
      <span class="ios-toggle ios-toggle--disabled" role="switch" aria-checked="false" aria-disabled="true">
        <span class="ios-toggle__knob"></span>
      </span>
    </div>
  </div>
  <p class="ios-footnote pud-note">Track 51×31 pt, radius 15.5 pt; knob 27 pt, inset 2 pt. Use the switch style only inside a list row — the row's own label describes it, so the switch never needs a separate label.</p>
</section>
